name: OpenWardRivingT CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck busybox-static sqlite3 nodejs

      - name: Lint shell scripts (shellcheck)
        run: |
          echo "=== Running shellcheck ==="
          shellcheck -e SC1090,SC2002,SC2010,SC2012,SC2015,SC2016,SC2018,SC2035,SC2045,SC3013,SC3043,SC3048 -x \
            install.sh \
            uninstall.sh \
            openwrt_files/usr/bin/wardriving_core.sh \
            openwrt_files/usr/bin/wardriving_clients.sh \
            openwrt_files/usr/bin/wardriving_replay.sh \
            openwrt_files/usr/bin/wardriving_sync.sh \
            openwrt_files/usr/lib/wardriving/common.sh \
            openwrt_files/usr/lib/wardriving/db.sh \
            openwrt_files/usr/lib/wardriving/remote.sh \
            openwrt_files/usr/lib/wardriving/handlers/status.sh \
            openwrt_files/usr/lib/wardriving/handlers/captures.sh \
            openwrt_files/usr/lib/wardriving/handlers/replay.sh \
            openwrt_files/usr/lib/wardriving/handlers/maps.sh \
            openwrt_files/usr/lib/wardriving/handlers/settings.sh \
            openwrt_files/etc/init.d/wardriving \
            openwrt_files/www/cgi-bin/wardriving_api \
            test/run_tests.sh
          echo "✓ shellcheck passed"

      - name: Validate shell syntax
        run: |
          echo "=== Checking POSIX shell syntax ==="
          for f in install.sh uninstall.sh \
                   openwrt_files/usr/bin/wardriving_core.sh \
                   openwrt_files/usr/bin/wardriving_clients.sh \
                   openwrt_files/usr/bin/wardriving_replay.sh \
                   openwrt_files/usr/bin/wardriving_sync.sh \
                   openwrt_files/usr/lib/wardriving/common.sh \
                   openwrt_files/usr/lib/wardriving/db.sh \
                   openwrt_files/usr/lib/wardriving/remote.sh \
                   openwrt_files/usr/lib/wardriving/handlers/status.sh \
                   openwrt_files/usr/lib/wardriving/handlers/captures.sh \
                   openwrt_files/usr/lib/wardriving/handlers/replay.sh \
                   openwrt_files/usr/lib/wardriving/handlers/maps.sh \
                   openwrt_files/usr/lib/wardriving/handlers/settings.sh \
                   openwrt_files/etc/init.d/wardriving \
                   openwrt_files/www/cgi-bin/wardriving_api; do
            sh -n "$f" || { echo "FAIL: $f"; exit 1; }
          done
          echo "✓ All scripts pass syntax check"

      - name: Validate BusyBox ash syntax
        run: |
          echo "=== Checking BusyBox ash syntax ==="
          for f in install.sh uninstall.sh \
                   openwrt_files/usr/bin/wardriving_core.sh \
                   openwrt_files/usr/bin/wardriving_clients.sh \
                   openwrt_files/usr/bin/wardriving_replay.sh \
                   openwrt_files/usr/bin/wardriving_sync.sh \
                   openwrt_files/usr/lib/wardriving/common.sh \
                   openwrt_files/usr/lib/wardriving/db.sh \
                   openwrt_files/usr/lib/wardriving/remote.sh \
                   openwrt_files/usr/lib/wardriving/handlers/status.sh \
                   openwrt_files/usr/lib/wardriving/handlers/captures.sh \
                   openwrt_files/usr/lib/wardriving/handlers/replay.sh \
                   openwrt_files/usr/lib/wardriving/handlers/maps.sh \
                   openwrt_files/usr/lib/wardriving/handlers/settings.sh \
                   openwrt_files/etc/init.d/wardriving \
                   openwrt_files/www/cgi-bin/wardriving_api; do
            busybox sh -n "$f" || { echo "FAIL: $f"; exit 1; }
          done
          echo "✓ All scripts pass BusyBox ash syntax check"

      - name: Run test suite
        run: |
          chmod +x test/run_tests.sh test/run_js_tests.sh
          sh test/run_tests.sh

      - name: Run test suite with BusyBox ash
        run: busybox sh test/run_tests.sh

      - name: Run JS unit tests (node --test)
        run: |
          chmod +x test/run_js_tests.sh
          sh test/run_js_tests.sh

      - name: Validate oui.json
        run: |
          python3 -m json.tool openwrt_files/www/wardriving/oui.json > /dev/null
          echo "✓ oui.json is valid JSON"

      - name: Validate manifest.json
        run: |
          python3 -m json.tool openwrt_files/www/wardriving/manifest.json > /dev/null
          echo "✓ manifest.json is valid JSON"

      - name: Validate app-utils.js syntax
        # app.js is intentionally not checked here: it's the dashboard
        # entry point with very long one-liners (e.g. the watchPosition
        # call) that node's parser flags as errors but browsers handle
        # fine. The browser is the source of truth for app.js; app-utils.js
        # is the one we also load in Node, so it's the one we lint here.
        run: |
          node --check openwrt_files/www/wardriving/app-utils.js
          echo "✓ app-utils.js syntax OK"

      - name: Validate GPU server syntax
        run: |
          python3 -m py_compile server_files/gpu_server.py
          echo "✓ gpu_server.py syntax OK"

      - name: Validate index.html basic structure
        run: |
          grep -q '<!DOCTYPE html>' openwrt_files/www/wardriving/index.html || { echo "FAIL: index.html missing DOCTYPE"; exit 1; }
          grep -q '</html>' openwrt_files/www/wardriving/index.html || { echo "FAIL: index.html missing closing tag"; exit 1; }
          grep -q 'href="app.css"' openwrt_files/www/wardriving/index.html || { echo "FAIL: index.html missing app.css"; exit 1; }
          grep -q 'src="app-utils.js"' openwrt_files/www/wardriving/index.html || { echo "FAIL: index.html missing app-utils.js"; exit 1; }
          grep -q 'src="app.js"' openwrt_files/www/wardriving/index.html || { echo "FAIL: index.html missing app.js"; exit 1; }
          echo "✓ index.html structure OK"
