name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  release:
    name: Build release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate tag matches VERSION
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/v}"
          file_version=$(tr -d '[:space:]' < VERSION)
          if [ "$tag" != "$file_version" ]; then
            echo "::error::Tag v$tag does not match VERSION ($file_version)."
            exit 1
          fi
          echo "Tag v$tag matches VERSION."

      - name: Verify install.sh + tests still pass
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y shellcheck busybox-static sqlite3 nodejs
          shellcheck -e SC1090,SC2002,SC2010,SC2012,SC2015,SC2016,SC2018,SC2035,SC2045,SC3013,SC3043,SC3048 -x \
            install.sh uninstall.sh \
            openwrt_files/usr/bin/*.sh \
            openwrt_files/usr/lib/wardriving/common.sh \
            openwrt_files/usr/lib/wardriving/db.sh \
            openwrt_files/usr/lib/wardriving/remote.sh \
            openwrt_files/usr/lib/wardriving/handlers/*.sh \
            openwrt_files/etc/init.d/wardriving \
            openwrt_files/www/cgi-bin/wardriving_api \
            scripts/*.sh \
            test/run_tests.sh
          sh test/run_tests.sh
          sh test/run_js_tests.sh

      - name: Build source tarball
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          archive="dist/openwardrivingt-${GITHUB_REF#refs/tags/v}.tar.gz"
          git archive --format=tar.gz --prefix="openwardrivingt-${GITHUB_REF#refs/tags/v}/" \
            -o "$archive" HEAD
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          ls -lh "$archive"

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          prev=$(git tag --sort=-version:refname | grep -E '^v[0-9]' | grep -v "^${GITHUB_REF#refs/tags/}$" | head -n 1 || true)
          if [ -n "$prev" ]; then
            range="$prev..${GITHUB_REF#refs/tags/}"
          else
            range="${GITHUB_REF#refs/tags/}"
          fi
          {
            echo "## Changes"
            echo ""
            if [ -n "$prev" ]; then
              echo "Full diff: https://github.com/${{ github.repository }}/compare/$prev...${GITHUB_REF#refs/tags/}"
            fi
            echo ""
            echo "### Commits"
            echo ""
            git log --no-merges --pretty=format:'- %s (%h)' "$range"
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false
          body_path: release-notes.md
          files: ${{ steps.archive.outputs.archive }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
